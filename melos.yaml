name: fieldscope

packages:
  - app/**
  - feature/**
  - utility/**

command:
  bootstrap:
    runPubGetInParallel: false

scripts:
  analyze:
    exec: dart analyze --fatal-infos .
    description: Run static analysis on every file.

  format:
    exec: dart format --set-exit-if-changed .
    description: Check formatting across every package
  
  test:
    exec: flutter test --coverage
    packageFilters:
      dirExists: test
    description: Run tests across every package that has a test directory.
